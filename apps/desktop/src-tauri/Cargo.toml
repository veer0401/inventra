[package]
name = "inventra-desktop"
version = "0.1.0"
description = "Inventra Pharmacy & Retail ERP Native Counter Terminal"
authors = ["Inventra Team"]
edition = "2021"

[lib]
name = "inventra_desktop_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.5", features = [] }

[dependencies]
tauri = { version = "2.2.4", features = [] }
tauri-plugin-sql = { version = "2.2.0", features = ["sqlite"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
