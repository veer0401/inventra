spring:
  application:
    name: inventra-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  mvc:
    problemdetails:
      enabled: true

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

app:
  timezone: Asia/Kolkata
  jwt:
    issuer: https://api.inventra.com
    audience: inventra-clients
    secret: ${JWT_SECRET}
    access-token-expiry: 900000
    refresh-token-expiry: 2592000000