server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: inventra-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  mvc:
    problemdetails:
      enabled: true

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  mail:
    host: ${SPRING_MAIL_HOST:${MAIL_HOST:smtp.gmail.com}}
    port: ${SPRING_MAIL_PORT:${MAIL_PORT:587}}
    username: ${SPRING_MAIL_USERNAME:${MAIL_USER:tripsync67@gmail.com}}
    password: ${SPRING_MAIL_PASSWORD:${MAIL_PASSWORD:eabb gjcv aatg hrnm}}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:true}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

app:
  timezone: Asia/Kolkata
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  jwt:
    issuer: https://api.inventra.com
    audience: inventra-clients
    secret: ${JWT_SECRET}
    access-token-expiry: 900000
    refresh-token-expiry: 2592000000
  mail:
    enabled: ${APP_MAIL_ENABLED:true}
    from: ${APP_MAIL_FROM:noreply@inventra.com}
    from-name: ${APP_MAIL_FROM_NAME:Inventra}
    frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}

razorpay:
  key-id: ${RAZORPAY_KEY_ID:}
  key-secret: ${RAZORPAY_KEY_SECRET:}